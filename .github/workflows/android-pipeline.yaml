name: Android Pipeline

on:
  # push:
  #   branches: [develop, beta, main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Override action for Android'
        type: choice
        options:
          - 'auto'
          - 'release'
          - 'patch'
          - 'distribute'
          - 'skip'
        default: 'auto'

concurrency:
  group: android-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  configure:
    name: Configure Android (${{ github.ref_name }})
    runs-on: ubuntu-latest
    outputs:
      flavor: ${{ steps.config.outputs.flavor }}
      play_track: ${{ steps.config.outputs.play_track }}
      prerelease: ${{ steps.config.outputs.prerelease }}
    steps:
      - name: Set config
        id: config
        run: |
          case "${{ github.ref_name }}" in
            develop)
              echo "flavor=dev" >> "$GITHUB_OUTPUT"
              echo "play_track=internal" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              ;;
            beta)
              echo "flavor=beta" >> "$GITHUB_OUTPUT"
              echo "play_track=beta" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              ;;
            main)
              echo "flavor=rel" >> "$GITHUB_OUTPUT"
              echo "play_track=production" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Error: unsupported branch '${{ github.ref_name }}'" >&2
              exit 1
              ;;
          esac
  
  detect:
    name: Detect Android Action
    needs: configure
    uses: ./.github/workflows/_detect-action.yaml
    with:
      platform: android
      branch: ${{ github.ref_name }}
      manual_action: ${{ inputs.action || 'auto' }}
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
  
  codegen:
    name: Code Generation
    needs: detect
    if: |
      !cancelled() 
      && needs.detect.result == 'success'
      && needs.detect.outputs.action != 'skip'
      && (needs.detect.outputs.action == 'release' || needs.detect.outputs.action == 'patch')
    uses: ./.github/workflows/_codegen.yaml
    with:
      flutter_version: ${{ needs.detect.outputs.flutter_version }}
    secrets:
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
      SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
  
  ensure-draft-release:
    name: Ensure Draft Release
    runs-on: ubuntu-latest
    needs: [detect]
    if: |
      !cancelled()
      && needs.detect.result == 'success'
      && needs.detect.outputs.action == 'release'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Create or verify draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ needs.detect.outputs.tag }}"
          
          echo "Checking for draft release: $RELEASE_TAG"
          
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q 'true'; then
            echo "✓ Draft release already exists: $RELEASE_TAG"
          elif gh release view "$RELEASE_TAG" 2>/dev/null; then
            echo "⚠ Release $RELEASE_TAG exists but is not a draft. Will use existing release."
          else
            echo "Creating draft release: $RELEASE_TAG"
            gh release create "$RELEASE_TAG" \
              --draft \
              --title "$RELEASE_TAG" \
              --notes "Draft release for $RELEASE_TAG - will be published after distribution completes"
            echo "✓ Created draft release: $RELEASE_TAG"
          fi
  
  release:
    name: Build Android Release
    needs: [configure, detect, codegen, ensure-draft-release]
    if: |
      !cancelled()
      && needs.detect.outputs.action == 'release'
      && needs.codegen.result == 'success'
      && needs.ensure-draft-release.result == 'success'
    uses: ./.github/workflows/_release-android.yaml
    with:
      flavor: ${{ needs.configure.outputs.flavor }}
      version: ${{ needs.detect.outputs.version }}
      build_number: ${{ needs.detect.outputs.build_number }}
      flutter_version: ${{ needs.detect.outputs.flutter_version }}
      tag: ${{ needs.detect.outputs.tag }}
      draft_release_tag: ${{ needs.detect.outputs.tag }}
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
  
  patch:
    name: Create Android Patch
    needs: [configure, detect, codegen]
    if: |
      !cancelled()
      && needs.detect.outputs.action == 'patch'
      && needs.codegen.result == 'success'
    uses: ./.github/workflows/_patch-android.yaml
    with:
      flavor: ${{ needs.configure.outputs.flavor }}
      version: ${{ needs.detect.outputs.version }}
      build_number: ${{ needs.detect.outputs.build_number }}
      flutter_version: ${{ needs.detect.outputs.flutter_version }}
      patch_number: ${{ needs.detect.outputs.patch_number }}
      tag: ${{ needs.detect.outputs.tag }}
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
  
  distribute:
    name: Distribute to Play Store
    needs: [configure, detect, release, patch]
    if: |
      !cancelled()
      && (needs.detect.outputs.action == 'distribute'
          || needs.release.result == 'success'
          || needs.patch.result == 'success')
    uses: ./.github/workflows/_distribute-android.yaml
    with:
      flavor: ${{ needs.configure.outputs.flavor }}
      version: ${{ needs.detect.outputs.version }}
      build_number: ${{ needs.detect.outputs.build_number }}
      tag: ${{ needs.detect.outputs.tag }}
      play_track: ${{ needs.configure.outputs.play_track }}
    secrets:
      PLAY_STORE_CREDENTIALS: ${{ secrets.PLAY_STORE_CREDENTIALS }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
  
  cleanup-on-failure:
    name: Cleanup on Failure
    needs: [detect, release, patch, distribute]
    if: failure()
    uses: ./.github/workflows/_cleanup.yaml
    with:
      platform: android
      version: ${{ needs.detect.outputs.tag }}
      delete_draft: true
      delete_tags: true
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
