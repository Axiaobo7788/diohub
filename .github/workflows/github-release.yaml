name: GitHub Release

on:
  # push:
  #   branches: [develop, beta, main]
  workflow_dispatch:
    inputs:
      wait_for_builds:
        description: 'Wait for platform builds to complete'
        type: boolean
        default: true
      timeout_minutes:
        description: 'Maximum wait time in minutes'
        type: number
        default: 60

concurrency:
  group: github-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  configure:
    name: Configure Release (${{ github.ref_name }})
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.config.outputs.prerelease }}
    steps:
      - name: Set config
        id: config
        run: |
          case "${{ github.ref_name }}" in
            develop|beta)
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              ;;
            main)
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Error: unsupported branch '${{ github.ref_name }}'" >&2
              exit 1
              ;;
          esac
  
  get-version:
    name: Get Version Info
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | sed 's/ *+.*//')
          BUILD_NUMBER=$(git rev-list --count HEAD)
          
          case "${{ github.ref_name }}" in
            develop)
              TAG="v${VERSION}-dev.${BUILD_NUMBER}"
              ;;
            beta)
              TAG="v${VERSION}-beta.${BUILD_NUMBER}"
              ;;
            main)
              TAG="v${VERSION}+${BUILD_NUMBER}"
              ;;
          esac
          
          {
            echo "version=$VERSION"
            echo "build_number=$BUILD_NUMBER"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
  
  wait-for-artifacts:
    name: Wait for Platform Builds
    runs-on: ubuntu-latest
    needs: get-version
    if: inputs.wait_for_builds != false
    timeout-minutes: ${{ inputs.timeout_minutes || 60 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Wait for build artifacts
        run: |
          TAG="${{ needs.get-version.outputs.tag }}"
          TIMEOUT=${{ inputs.timeout_minutes || 60 }}
          ELAPSED=0
          
          echo "Waiting for platform builds to complete for $TAG"
          echo "Timeout: ${TIMEOUT} minutes"
          echo ""
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            # Fetch latest tags
            git fetch --tags origin
            
            # Check for distributed tags (both platforms must complete distribution)
            ANDROID_DIST=$(git tag -l "pipeline/${TAG}/android/distributed" | head -n1 || true)
            IOS_DIST=$(git tag -l "pipeline/${TAG}/ios/distributed" | head -n1 || true)
            
            if [ -n "$ANDROID_DIST" ] && [ -n "$IOS_DIST" ]; then
              echo "✓ Both platforms completed distribution"
              echo "  Android: $ANDROID_DIST"
              echo "  iOS: $IOS_DIST"
              exit 0
            fi
            
            # Show status
            if [ -n "$ANDROID_DIST" ]; then
              echo "⏳ Android: completed, iOS: waiting... (${ELAPSED}/${TIMEOUT} min)"
            elif [ -n "$IOS_DIST" ]; then
              echo "⏳ iOS: completed, Android: waiting... (${ELAPSED}/${TIMEOUT} min)"
            else
              echo "⏳ Waiting for both platforms... (${ELAPSED}/${TIMEOUT} min)"
            fi
            
            sleep 60
            ELAPSED=$((ELAPSED + 1))
          done
          
          echo "⚠ Timeout reached, proceeding with available builds"
          echo "This may result in incomplete artifacts in the release"
  
  publish:
    name: Publish GitHub Release
    needs: [configure, get-version, wait-for-artifacts]
    if: always() && needs.get-version.result == 'success'
    uses: ./.github/workflows/_publish-release.yaml
    with:
      tag: ${{ needs.get-version.outputs.tag }}
      final_tag: ${{ needs.get-version.outputs.tag }}
      version: ${{ needs.get-version.outputs.version }}
      build_number: ${{ needs.get-version.outputs.build_number }}
      prerelease: ${{ needs.configure.outputs.prerelease == 'true' }}
      branch: ${{ github.ref_name }}
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GIORNO_PERSONALITY: ${{ secrets.GIORNO_PERSONALITY }}
      GIORNO_APP_ID: ${{ secrets.GIORNO_APP_ID }}
      GIORNO_APP_KEY: ${{ secrets.GIORNO_APP_KEY }}
