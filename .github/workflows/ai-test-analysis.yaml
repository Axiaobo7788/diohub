name: AI Test Analysis (Joseph)

# Downstream pause: the reusable workflow belongs to the upstream premium
# repository. Keep this file recoverable without reacting to CI failures.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  call-private:
    if: ${{ false }}
    uses: namanshergill/diohub-premium/.github/workflows/_ai-test-analysis.yaml@main
    with:
      run_id: ${{ github.event.workflow_run.id }}
      head_branch: ${{ github.event.workflow_run.head_branch }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
