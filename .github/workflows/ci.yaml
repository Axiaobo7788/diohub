name: CI

on:
  push:
    branches: [develop, beta, main]
  pull_request:
    branches: [develop, beta, main]
  workflow_dispatch:

jobs:
  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cocogitto/cocogitto-action@v4
        with:
          command: check

  lint-workflows:
    name: Lint Workflows
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-pr-review
          fail_level: error

  codegen:
    name: Code Generation
    uses: ./.github/workflows/_codegen.yaml

  test:
    name: Tests
    needs: [codegen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          channel: 'stable'
          cache: true

      - name: Download generated code
        uses: actions/download-artifact@v4
        with:
          name: generated-code

      - name: Extract generated code
        run: tar xzf generated-code.tar.gz

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze for errors
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  android-debug:
    name: Android Debug Build
    needs: [codegen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: generated-code

      - name: Extract generated code
        run: tar xzf generated-code.tar.gz

      - name: Install dependencies
        run: flutter pub get

      - name: Build development APK
        run: flutter build apk --debug --flavor dev -t lib/main.dart

  linux-debug:
    name: Linux Debug Build
    needs: [codegen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install WPE WebKit
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwpewebkit-1.0-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: generated-code

      - name: Extract generated code
        run: tar xzf generated-code.tar.gz

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux application
        run: flutter build linux --debug -t lib/main.dart
