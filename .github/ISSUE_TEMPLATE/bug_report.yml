name: Bug Report
description: Report a bug or unexpected behavior in DioHub
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below to help us resolve the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what you see!
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: I expected...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Instead, I saw...
    validations:
      required: true

  - type: dropdown
    id: flavor
    attributes:
      label: App Flavor
      description: Which build flavor are you using?
      options:
        - dev (development)
        - beta (testing)
        - rel (production/Play Store)
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform are you using?
      options:
        - Android
        - iOS
        - macOS
        - Linux
        - Windows
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - crash (app crashes or becomes unusable)
        - major (core feature broken)
        - minor (small issue, workaround exists)
        - cosmetic (UI/visual issue)
    validations:
      required: false

  - type: textarea
    id: flutter-doctor
    attributes:
      label: Flutter Doctor Output
      description: Run `flutter doctor -v` and paste the output here
      render: shell
      placeholder: |
        [✓] Flutter (Channel stable, 3.5.0, on macOS...)
        [✓] Android toolchain...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs and Screenshots
      description: |
        Add any relevant logs, error messages, or screenshots.
        Tip: You can attach images by clicking this area to highlight it and then dragging files in.
      placeholder: Paste logs or drag images here
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (device model, Android/iOS version, etc.)
      placeholder: Any other relevant information...
    validations:
      required: false
