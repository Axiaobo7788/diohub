sonar.projectKey=namanshergill_diohub
sonar.organization=namanshergill

# Metadata
sonar.projectName=DioHub
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=lib
sonar.tests=test

# Dart/Flutter specific
sonar.language=dart
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/*.gr.dart,\
  **/*.config.dart,\
  **/generated/**,\
  **/l10n/**,\
  lib/generated_plugin_registrant.dart,\
  packages/**/test/**,\
  dependencies/**,\
  .dart_tool/**,\
  build/**,\
  ios/**,\
  android/**,\
  macos/**,\
  linux/**,\
  windows/**,\
  web/**

# Test exclusions
sonar.test.exclusions=\
  **/*_test.dart,\
  **/test_*.dart

# Coverage report path (generated by flutter test --coverage)
sonar.dart.coverage.reportPaths=coverage/lcov.info

# Duplication
sonar.cpd.exclusions=\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/*.gr.dart
