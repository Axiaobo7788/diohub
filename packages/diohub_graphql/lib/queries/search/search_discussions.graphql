# import '../../fragments/discussion_card_fields.graphql'

query searchDiscussions($query: String!, $first: Int!, $after: String) {
  search(query: $query, type: DISCUSSION, first: $first, after: $after) {
    discussionCount
    pageInfo {
      endCursor
      hasNextPage
    }
    nodes {
      __typename
      ... on Discussion {
        ...discussionCardFields
      }
    }
  }
}
