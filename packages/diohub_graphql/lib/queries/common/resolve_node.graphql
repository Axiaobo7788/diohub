# import '../../fragments/comment_node_fields.graphql'

query resolveNode($id: ID!) {
  node(id: $id) {
    __typename
    ... on IssueComment {
      ...issueCommentNodeFields
    }
    ... on PullRequestReviewComment {
      ...pullRequestReviewCommentNodeFields
    }
    ... on DiscussionComment {
      ...discussionCommentNodeFields
    }
  }
}
