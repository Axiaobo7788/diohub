# import '../../fragments/user_card_fields.graphql'

query getStargazers(
  $owner: String!
  $name: String!
  $first: Int!
  $after: String
) {
  repository(owner: $owner, name: $name) {
    stargazers(first: $first, after: $after) {
      pageInfo {
        hasNextPage
        endCursor
      }
      edges {
        cursor
        node {
          ...userCardFields
        }
      }
    }
  }
}
