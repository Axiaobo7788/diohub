# import '../../fragments/actor.graphql'

mutation dismissVulnerabilityAlert($alertId: ID!, $reason: DismissReason!) {
  dismissRepositoryVulnerabilityAlert(
    input: { repositoryVulnerabilityAlertId: $alertId, dismissReason: $reason }
  ) {
    repositoryVulnerabilityAlert {
      id
      state
      dismissedAt
      dismissReason
      dismisser {
        ... on Actor {
          ...actor
        }
      }
    }
  }
}
