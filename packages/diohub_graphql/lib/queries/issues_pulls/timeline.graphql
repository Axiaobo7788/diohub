fragment pullRequestReview on PullRequestReview {
  id
  resourcePath
  comments(first: 1) {
    totalCount
    edges {
      node {
        id
      }
      cursor
    }
  }
  author {
    ...actor
  }
  createdAt
  authorAssociation
  body
  bodyHTML
  lastEditedAt
  state
  reactionGroups {
    ...reactionGroups
