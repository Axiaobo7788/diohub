# import '../../fragments/issue_card_fields.graphql'

query issueSubIssues(
  $owner: String!
  $name: String!
  $number: Int!
  $first: Int = 20
  $after: String
) {
  repository(owner: $owner, name: $name) {
    issue(number: $number) {
      subIssues(first: $first, after: $after) {
        totalCount
        nodes {
          ...issueCardFields
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
  }
}
