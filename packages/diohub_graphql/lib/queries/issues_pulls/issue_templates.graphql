# import '../../fragments/label.graphql'

query issueTemplates($name: String!, $owner: String!) {
  repository(name: $name, owner: $owner) {
    issueTemplates {
      name
      title
      body
      about
      filename
      labels(first: 20) {
        nodes {
          ...label
        }
      }
      assignees(first: 10) {
        nodes {
          id
          login
          avatarUrl
        }
      }
    }
  }
}
