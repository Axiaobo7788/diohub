query getOrgTeams($org: String!, $first: Int!, $after: String) {
  organization(login: $org) {
    teams(
      first: $first
      after: $after
      orderBy: { field: NAME, direction: ASC }
    ) {
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
      edges {
        cursor
        node {
          id
          name
          slug
          description
          privacy
          avatarUrl(size: 80)
          parentTeam {
            name
            slug
          }
          members {
            totalCount
          }
          repositories {
            totalCount
          }
        }
      }
    }
  }
}
