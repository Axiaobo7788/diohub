query getUserProjectsV2(
  $user: String!
  $first: Int!
  $after: String
  $query: String
  $orderBy: ProjectV2Order
) {
  user(login: $user) {
    projectsV2(
      first: $first
      after: $after
      query: $query
      orderBy: $orderBy
    ) {
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
      edges {
        cursor
        node {
          id
          title
          number
          url
          closed
          updatedAt
        }
      }
    }
  }
}
