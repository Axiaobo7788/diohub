# import '../../fragments/repo_card_fields.graphql'

query getUserPinnedRepos($user: String!) {
  user(login: $user) {
    pinnedItems(first: 6, types: [REPOSITORY]) {
      edges {
        node {
          __typename
          ... on Repository {
            ...repoCardFields
          }
        }
      }
    }
  }
}

query getUserStarredRepositories($user: String!, $first: Int!, $after: String) {
  user(login: $user) {
    starredRepositories(first: $first, after: $after) {
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
      edges {
        cursor
        node {
          ...repoCardFields
        }
      }
    }
  }
}
