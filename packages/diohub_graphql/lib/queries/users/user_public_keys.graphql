query userPublicKeys($login: String!, $first: Int!, $after: String) {
  user(login: $login) {
    publicKeys(first: $first, after: $after) {
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        id
        key
        fingerprint
        createdAt
        accessedAt
        isReadOnly
      }
    }
  }
}
