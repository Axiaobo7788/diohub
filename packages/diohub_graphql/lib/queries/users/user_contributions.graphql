# Query for fetching user contribution data with customizable date ranges
# This allows independent updates of contribution data without refetching all user info

# import '../../fragments/issue_card_fields.graphql'
# import '../../fragments/pull_card_fields.graphql'
# import '../../fragments/repo_card_fields.graphql'

query userContributions($user: String!, $from: DateTime, $to: DateTime) {
  user(login: $user) {
    __typename
    id
    login
    contributionsCollection(from: $from, to: $to) {
      totalCommitContributions
      totalIssueContributions
      totalPullRequestContributions
      totalPullRequestReviewContributions
      totalRepositoriesWithContributedCommits
      totalRepositoriesWithContributedIssues
      totalRepositoriesWithContributedPullRequests
      totalRepositoriesWithContributedPullRequestReviews
      totalRepositoryContributions
      restrictedContributionsCount
      doesEndInCurrentMonth
      hasActivityInThePast
      hasAnyContributions
      hasAnyRestrictedContributions
      isSingleDay
      startedAt
      endedAt
      earliestRestrictedContributionDate
      latestRestrictedContributionDate
      contributionCalendar {
        totalContributions
        colors
        weeks {
          firstDay
          contributionDays {
            contributionCount
            date
            color
            contributionLevel
            weekday
          }
        }
        months {
          name
          year
          firstDay
          totalWeeks
        }
      }
      firstIssueContribution {
        __typename
        ... on CreatedIssueContribution {
          isRestricted
          occurredAt
          url
          resourcePath
          issue {
            ...issueCardFields
          }
        }
        ... on RestrictedContribution {
          occurredAt
        }
      }
      firstPullRequestContribution {
        __typename
        ... on CreatedPullRequestContribution {
          isRestricted
          occurredAt
          url
          resourcePath
          pullRequest {
            ...pullCardFields
          }
        }
        ... on RestrictedContribution {
          occurredAt
        }
      }
      firstRepositoryContribution {
        __typename
        ... on CreatedRepositoryContribution {
          isRestricted
          occurredAt
          url
          resourcePath
          repository {
            ...repoCardFields
            createdAt
          }
        }
        ... on RestrictedContribution {
          occurredAt
        }
      }
      popularIssueContribution {
        __typename
        ... on CreatedIssueContribution {
          isRestricted
          occurredAt
          issue {
            ...issueCardFields
          }
        }
      }
      popularPullRequestContribution {
        __typename
        ... on CreatedPullRequestContribution {
          isRestricted
          occurredAt
          pullRequest {
            ...pullCardFields
          }
        }
      }
      joinedGitHubContribution {
        occurredAt
      }
      commitContributionsByRepository(maxRepositories: 100) {
        repository {
          ...repoCardFields
        }
        contributions {
          totalCount
        }
      }
      issueContributionsByRepository(maxRepositories: 100) {
        repository {
          ...repoCardFields
        }
        contributions {
          totalCount
        }
      }
      pullRequestContributionsByRepository(maxRepositories: 100) {
        repository {
          ...repoCardFields
        }
        contributions {
          totalCount
        }
      }
      pullRequestReviewContributionsByRepository(maxRepositories: 100) {
        repository {
          ...repoCardFields
        }
        contributions {
          totalCount
        }
      }
      contributionYears
    }
  }
}
