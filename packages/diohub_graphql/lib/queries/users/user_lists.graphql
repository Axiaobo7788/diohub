# import '../../fragments/user_card_fields.graphql'
# import '../../fragments/organization_card_fields.graphql'

query getUserFollowers($user: String!, $first: Int!, $after: String) {
  user(login: $user) {
    followers(first: $first, after: $after) {
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
      edges {
        cursor
        node {
          ...userCardFields
        }
      }
    }
  }
}

