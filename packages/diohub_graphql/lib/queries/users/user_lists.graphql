query getUserGists($user: String!, $first: Int!, $after: String) {
  user(login: $user) {
    gists(
      first: $first
      after: $after
      orderBy: { field: UPDATED_AT, direction: DESC }
      privacy: ALL
    ) {
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
      edges {
        cursor
        node {
          id
          name
          description
          isPublic
          isFork
          createdAt
          updatedAt
          stargazerCount
          url
          comments(first: 0) {
            totalCount
          }
          forks(first: 0) {
            totalCount
          }
          files(limit: 5) {
            name
            language {
              name
              color
            }
          }
        }
      }
    }
  }
}
