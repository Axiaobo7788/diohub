# import '../../fragments/repo_card_fields.graphql'

query getUserWatching($user: String!, $first: Int!, $after: String) {
  user(login: $user) {
    watching(first: $first, after: $after) {
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
      edges {
        cursor
        node {
          ...repoCardFields
        }
      }
    }
  }
}
