plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "io.sentry.android.gradle"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}


def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Load .env file for secrets
def envProperties = new Properties()
def envFile = rootProject.file('../.env')
if (envFile.exists()) {
    envFile.withReader('UTF-8') { reader ->
        envProperties.load(reader)
    }
}

android {
    // compileSdkVersion flutter.compileSdkVersion
    compileSdkVersion 36
    ndkVersion = "28.0.12674087"
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    defaultConfig {
        applicationId "com.felix.diohub"
       minSdkVersion 26
        // minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        manifestPlaceholders += [
                'appAuthRedirectScheme': 'auth.felix.diohub'
        ]
    }

    signingConfigs {
        release {
            keyAlias System.getenv('KEY_ALIAS') ?: envProperties.getProperty('KEY_ALIAS')
            keyPassword System.getenv('KEY_PASSWORD') ?: envProperties.getProperty('KEY_PASSWORD')
            def ksFile = System.getenv('KEYSTORE_FILE') ?: envProperties.getProperty('KEYSTORE_FILE')
            storeFile ksFile ? file(ksFile) : null
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: envProperties.getProperty('KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            // Signing will be overridden per flavor if needed
            signingConfig signingConfigs.release
            vcsInfo.include = false
        }
    }
    // ABI splits disabled: AABs handle multi-ABI natively, and splits
    // conflict with bundleXxxRelease tasks (issuetracker.google.com/402800800).
    // APK builds still produce a universal binary.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
            excludes += ['**/lib/armeabi/**', '**/lib/mips/**', '**/lib/mips64/**']
        }
    }
    namespace 'com.felix.diohub'
    lint {
        disable 'InvalidPackage'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

sentry {
    autoInstallation {
        enabled = false
    }
    
    // Load auth token from env var (CI) or .env file (local dev)
    authToken = System.getenv('SENTRY_AUTH_TOKEN') ?: envProperties.getProperty('SENTRY_AUTH_TOKEN')
    
    // Sentry organization and project configuration
    org = "diohub"
    projectName = "diohub"
    
    // Enable ProGuard mapping upload
    includeProguardMapping = true
}

// Disable ArtProfile generation for reproducible builds
tasks.whenTaskAdded { task ->
    if (task.name.contains("ArtProfile")) {
        task.enabled = false
    }
}

// ----- BEGIN flavorDimensions (autogenerated by flutter_flavorizr) -----
apply from: "flavorizr.gradle"
