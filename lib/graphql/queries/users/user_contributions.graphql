# Query for fetching user contribution data with customizable date ranges
# This allows independent updates of contribution data without refetching all user info

# import './user_info.graphql'

query userContributions($user: String!, $from: DateTime, $to: DateTime) {
    user(login: $user) {
        __typename
        id
        login
        contributionsCollection(from: $from, to: $to) {
            totalCommitContributions
            totalIssueContributions
            totalPullRequestContributions
            totalPullRequestReviewContributions
            totalRepositoriesWithContributedCommits
            totalRepositoriesWithContributedIssues
            totalRepositoriesWithContributedPullRequests
            totalRepositoriesWithContributedPullRequestReviews
            totalRepositoryContributions
            restrictedContributionsCount
            doesEndInCurrentMonth
            hasActivityInThePast
            hasAnyContributions
            hasAnyRestrictedContributions
            isSingleDay
            startedAt
            endedAt
            earliestRestrictedContributionDate
            latestRestrictedContributionDate
            contributionCalendar {
                totalContributions
                colors
                weeks {
                    firstDay
                    contributionDays {
                        contributionCount
                        date
                        color
                        contributionLevel
                        weekday
                    }
                }
                months {
                    name
                    year
                    firstDay
                    totalWeeks
                }
            }
            firstIssueContribution {
                __typename
                ... on CreatedIssueContribution {
                    issue {
                        id
                        number
                        title
                        url
                        createdAt
                        repository {
                            name
                            owner {
                                login
                            }
                        }
                    }
                }
                ... on RestrictedContribution {
                    occurredAt
                }
            }
            firstPullRequestContribution {
                __typename
                ... on CreatedPullRequestContribution {
                    pullRequest {
                        id
                        number
                        title
                        url
                        createdAt
                        repository {
                            name
                            owner {
                                login
                            }
                        }
                    }
                }
                ... on RestrictedContribution {
                    occurredAt
                }
            }
            firstRepositoryContribution {
                __typename
                ... on CreatedRepositoryContribution {
                    repository {
                        id
                        name
                        description
                        url
                        createdAt
                        owner {
                            login
                        }
                        stargazerCount
                        isPrivate
                    }
                }
                ... on RestrictedContribution {
                    occurredAt
                }
            }
            popularIssueContribution {
                __typename
                ... on CreatedIssueContribution {
                    issue {
                        id
                        number
                        title
                        url
                        createdAt
                        body
                        state
                        repository {
                            name
                            owner {
                                login
                            }
                        }
                        comments {
                            totalCount
                        }
                    }
                }
                ... on RestrictedContribution {
                    occurredAt
                }
            }
            popularPullRequestContribution {
                __typename
                ... on CreatedPullRequestContribution {
                    pullRequest {
                        id
                        number
                        title
                        url
                        createdAt
                        body
                        state
                        mergedAt
                        repository {
                            name
                            owner {
                                login
                            }
                        }
                        comments {
                            totalCount
                        }
                    }
                }
                ... on RestrictedContribution {
                    occurredAt
                }
            }
            joinedGitHubContribution {
                occurredAt
            }
            commitContributionsByRepository(maxRepositories: 50) {
                repository {
                    ...repositoryFields
                    primaryLanguage {
                        name
                        color
                    }
                }
                contributions {
                    totalCount
                }
            }
            issueContributionsByRepository(maxRepositories: 25) {
                repository {
                    ...repositoryFields
                }
                contributions {
                    totalCount
                }
            }
            pullRequestContributionsByRepository(maxRepositories: 25) {
                repository {
                    ...repositoryFields
                }
                contributions {
                    totalCount
                }
            }
            pullRequestReviewContributionsByRepository(maxRepositories: 25) {
                repository {
                    ...repositoryFields
                }
                contributions {
                    totalCount
                }
            }
            contributionYears
        }
    }
}

