# Query for fetching user's pull request contributions with pagination
# Used for pull request chip detail bottom sheet

# import './user_info.graphql'
# import './user_activity_timeline_full.graphql'

query userPullRequestContributions(
  $user: String!
  $from: DateTime
  $to: DateTime
  $after: String
  $first: Int = 50
) {
  user(login: $user) {
    __typename
    id
    login
    contributionsCollection(from: $from, to: $to) {
      totalPullRequestContributions
      pullRequestContributionsByRepository(maxRepositories: 100) {
        repository {
          ...repositoryFields
        }
        contributions(
          first: $first
          after: $after
          orderBy: { direction: DESC }
        ) {
          totalCount
          pageInfo {
            hasNextPage
            endCursor
          }
          nodes {
            occurredAt
            pullRequest {
              ...pullInfoTimeline
            }
          }
        }
      }
    }
  }
}
